services:
  - type: web
    name: taskmanager-api
    env: python
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn taskmanager.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: taskmanager-db
          property: connectionString
    healthCheckPath: /api/
databases:
  - name: taskmanager-db
    databaseName: taskmanager
    user: taskmanager_user